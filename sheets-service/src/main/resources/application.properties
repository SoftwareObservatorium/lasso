spring.application.name=sheets-service
server.port=8877
# webapp context root
server.contextPath=/
# pretty print JSON?
spring.jackson.serialization.INDENT_OUTPUT = false

# Server compression
server.compression.enabled=true
server.compression.min-response-size=2048

# matcher issues
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

#### JWT bearer tokens
# secret
security.jwt.token.secret-key=f84f48fh89dhf
# TTL in seconds
